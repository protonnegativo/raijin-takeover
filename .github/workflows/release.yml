name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changes that reach the binary
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # No release when the push only touched fixtures, docs or CI; engines.json is embedded, so it releases.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD | grep -vE '^bench/fixtures/|\.md$|^docs/|^\.github/' || true)
          echo "changed: ${changed:-(none)}"
          if [ -n "$changed" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
      - name: Tag and release
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true'
        run: .github/release.sh "${{ inputs.bump || 'patch' }}"
