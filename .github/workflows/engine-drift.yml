name: Engine drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dnsx:
        description: dnsx version to test (latest or vX.Y.Z)
        default: latest

permissions:
  contents: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dnsx
        env:
          WANT: ${{ inputs.dnsx || 'latest' }}
        run: |
          module=$(jq -r .dnsx.go engines.json)
          go install "$module@$WANT"
      - name: Installed versions
        id: versions
        run: |
          installed=$(dnsx -version -duc 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          tested=$(jq -r .dnsx.version engines.json)
          echo "dnsx installed $installed, tested $tested"
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Known answer, a name that cannot exist
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
        run: |
          # dnsx 1.3.0+ writes no -json line for names without records, even with -rcode
          # (projectdiscovery/dnsx#1091): NXDOMAIN names and dangling CNAMEs would vanish, and the live
          # benchmark cannot see it because it compares with dnsx's own output. One name, the runner's
          # resolver, the exact arguments raijin-takeover passes (internal/dnsx Args; a test keeps them equal).
          # The .example TLD is reserved (RFC 2606): the root answers NXDOMAIN. example.com is no good, it
          # answers NOERROR for any name.
          name="raijin-drift-$RANDOM$RANDOM.example"
          echo "$name" > "$RUNNER_TEMP/nx.txt"
          resolver=$(awk '/^nameserver/ { print $2; exit }' /etc/resolv.conf)
          out=$(dnsx -l "$RUNNER_TEMP/nx.txt" -a -aaaa -resp -json -silent -nc -duc -omit-raw -rcode noerror,formerr,servfail,nxdomain,notimp,refused -r "${resolver:-1.1.1.1}" 2>&1 || true)
          echo "$out"
          if ! grep -q '"status_code":"NXDOMAIN"' <<<"$out"; then
            {
              echo "dnsx $INSTALLED wrote no NXDOMAIN line for $name, with the arguments raijin-takeover uses."
              echo "Names that do not resolve, and so every dangling CNAME, would get no line at all."
              echo "This is the -json regression of dnsx 1.3.0+: https://github.com/projectdiscovery/dnsx/pull/1091"
              echo "engines.json is not bumped. dnsx output: ${out:-(nothing)}"
            } > "$RUNNER_TEMP/verify.txt"
            exit 1
          fi
      - run: pip install tiktoken
      - name: Live benchmark
        id: bench
        env:
          LIVE: "1"
          PY: python3
        run: |
          W="$RUNNER_TEMP/bench"
          set +e
          bench/run.sh "$W" > "$RUNNER_TEMP/bench.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/bench.txt"
          grep -E 'missing from output|MISSING' "$RUNNER_TEMP/bench.txt" > "$RUNNER_TEMP/verify.txt" || true
          grep -h '"engine_format"' "$W"/*.live.json >> "$RUNNER_TEMP/verify.txt" && status=1
          if [ "$status" != 0 ] || grep -qE 'MISSING|[1-9][0-9]* missing from output' "$RUNNER_TEMP/verify.txt" \
            || [ "$(grep -c ' 0 missing from output' "$RUNNER_TEMP/verify.txt")" != 3 ]; then
            echo "bench run exited $status" >> "$RUNNER_TEMP/verify.txt"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-live
          path: ${{ runner.temp }}/bench
          retention-days: 14
      - name: Commit the bump and release
        if: success()
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
          TESTED: ${{ steps.versions.outputs.tested }}
        run: |
          newer=$(printf '%s\n%s\n' "$TESTED" "$INSTALLED" | sort -V | tail -1)
          if [ -z "$INSTALLED" ] || [ "$INSTALLED" = "$TESTED" ] || [ "$newer" != "$INSTALLED" ]; then
            echo "dnsx $INSTALLED is not newer than the tested $TESTED"
            exit 0
          fi
          # Only engines.json: the refreshed fixtures are in the artifact, BENCHMARK.md keeps its numbers.
          git checkout -- bench
          jq --arg v "$INSTALLED" '.dnsx.version = $v' engines.json > engines.json.new
          python3 - engines.json.new <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          with open("engines.json", "w") as f:
              f.write("{\n" + ",\n".join(f'  "{k}": {json.dumps(v, separators=(", ", ": "))}' for k, v in d.items()) + "\n}\n")
          PY
          rm engines.json.new
          if ! go test ./... > "$RUNNER_TEMP/test.txt" 2>&1; then
            cat "$RUNNER_TEMP/test.txt"
            { echo "go test failed with dnsx $INSTALLED in engines.json:"; tail -40 "$RUNNER_TEMP/test.txt"; } > "$RUNNER_TEMP/verify.txt"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Test with dnsx $INSTALLED"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          # A push made with GITHUB_TOKEN does not trigger release.yml, so tag here.
          .github/release.sh patch
      - name: Close the drift issue
        if: success()
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
        run: |
          for n in $(gh issue list --label engine-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Passes with dnsx $INSTALLED: $RUN_URL"
          done
      - name: Open or update the drift issue
        if: failure()
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
        run: |
          gh label create engine-drift --color B60205 --description "An engine update broke the tool" 2>/dev/null || true
          {
            echo "The live benchmark or the tests failed with dnsx $INSTALLED."
            echo
            echo '```'
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "(no verify output)"
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          open=$(gh issue list --label engine-drift --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Engine drift: dnsx $INSTALLED" --label engine-drift --body-file "$RUNNER_TEMP/issue.md"
          fi
